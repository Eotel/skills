name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
      - name: Python lint and types
        run: .githooks/pre-commit
      - name: Skill script tests
        run: python3 -m unittest discover -s tests
      - name: Structural rule fixtures and snapshots
        run: |
          npx --yes --package @ast-grep/cli@0.45.3 ast-grep test --config ast-grep-practice/assets/node-import/sgconfig.yml
          npx --yes --package @ast-grep/cli@0.45.3 ast-grep test --config ast-grep-practice/assets/examples/sgconfig.yml
      - name: Snapshot coherence
        run: npx --yes --package @ast-grep/cli@0.45.3 -c 'python3 ast-grep-practice/scripts/check_snapshots.py ast-grep-practice/assets/node-import ast-grep-practice/assets/examples'
