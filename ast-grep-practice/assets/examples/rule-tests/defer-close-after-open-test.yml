id: defer-close-after-open
valid:
  - |
      package main; func example() { f, err := os.Open("x"); defer f.Close() }
invalid:
  - |
      package main; func example() { f, err := os.Open("x") }
  - |
      package main; func example() { f, _ := os.Open("a"); g, _ := os.Open("b"); defer g.Close() }
