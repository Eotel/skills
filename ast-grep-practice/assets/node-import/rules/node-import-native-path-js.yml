id: node-import-native-path-js
language: JavaScript
severity: warning
rule:
  any:
    - pattern: $SPAWN(process.execPath, ["--import", $PATH])
    - pattern: $SPAWN(process.execPath, ["--import", $PATH], $$$OPTIONS)
    - pattern: $SPAWN(process.execPath, ["--import", $PATH, $$$AFTER])
    - pattern: $SPAWN(process.execPath, ["--import", $PATH, $$$AFTER], $$$OPTIONS)
    - pattern: $SPAWN(process.execPath, ['--import', $PATH])
    - pattern: $SPAWN(process.execPath, ['--import', $PATH], $$$OPTIONS)
    - pattern: $SPAWN(process.execPath, ['--import', $PATH, $$$AFTER])
    - pattern: $SPAWN(process.execPath, ['--import', $PATH, $$$AFTER], $$$OPTIONS)
constraints:
  SPAWN:
    regex: '^(spawn|spawnSync|execFile|execFileSync|(cp|childProcess)\.(spawn|spawnSync|execFile|execFileSync))$'
  PATH:
    any:
      - pattern: join($$$ARGS)
      - pattern: resolve($$$ARGS)
      - pattern: path.join($$$ARGS)
      - pattern: path.resolve($$$ARGS)
      - all:
          - kind: identifier
          - inside:
              any:
                - kind: statement_block
                - kind: program
              stopBy:
                any:
                  - kind: statement_block
                  - kind: program
              has:
                all:
                  - kind: lexical_declaration
                  - regex: '^const\b'
                  - has:
                      kind: variable_declarator
                      all:
                        - has:
                            kind: identifier
                            field: name
                            pattern: $PATH
                        - has:
                            field: value
                            any:
                              - pattern: join($$$ARGS)
                              - pattern: resolve($$$ARGS)
                              - pattern: path.join($$$ARGS)
                              - pattern: path.resolve($$$ARGS)
                stopBy: neighbor
message: Nodeの--importへ渡すOSのパスは、pathToFileURL(path).hrefでfile URLに変換する。
note: |
  Why: --import resolves ESM specifiers as URLs. Native paths containing # or ?
  and Windows drive-letter paths can be interpreted incorrectly.
  Scope: direct join/resolve calls, or direct const declarations in the same nearest block.
  TypeScript type annotations and single- or double-quoted --import flags are covered.
  The literal --import flag must be the first array element; prefixes are outside
  this guard to avoid mistaking script arguments or option values for preloads.
  Helper returns, aliases, outer bindings, and --import=value are not inspected.
  This syntax rule assumes join/resolve and spawn names are Node APIs; inspect
  a finding if these names are bound to unrelated functions.
  No automatic fix: pathToFileURL must be imported and relative paths need the
  child's intended working directory before conversion.
  https://nodejs.org/api/esm.html#urls
